name: Windows EXE Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: EXE oluştur
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CariTakip --paths . app/main.py

      - name: Veritabanını ekle
        shell: cmd
        run: |
          xcopy /E /I /Y data dist\CariTakip\data

      - name: ZIP oluştur
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CariTakip -DestinationPath CariTakip-Windows.zip

      - name: EXE paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: CariTakip-Windows
          path: CariTakip-Windows.zip
